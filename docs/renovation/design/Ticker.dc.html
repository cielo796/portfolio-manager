<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>指数ティッカーとステータスバー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<footer style="font-family: Inter, 'Noto Sans JP', sans-serif; font-size: 12px; color: #d8dee7; font-variant-numeric: tabular-nums">
<div aria-label="主要指数" style="display: flex; align-items: center; min-height: 28px; overflow-x: auto; background: #161c25; border-top: 1px solid #232b36; border-bottom: 1px solid #232b36">
<sc-for list="{{items}}" as="t" hint-placeholder-count="12">
<div style="display: flex; align-items: baseline; gap: 6px; padding: 0 12px; border-right: 1px solid #232b36; white-space: nowrap">
<span style="color: #9aa6b6">{{t.name}}</span>
<span style="font-weight: 600">{{t.val}}</span>
<span style="color: {{t.color}}">{{t.chg}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-height: 20px; padding: 0 12px; background: #0b0f14; color: #9aa6b6; font-size: 11px">
<span>DB：ローカル（portfolio.db）</span>
<span>最終同期：PC-B（書斎）10/22 21:12　受信12・送信3・競合0</span>
<span>価格取得：21:30:12　失敗0件</span>
<span style="flex: 1 1 0"></span>
<span style="padding: 0 6px; border: 1px solid #3a4452; border-radius: 3px">表示値はサンプル</span>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"updown":{"editor":"enum","options":["日本式","米国式"],"default":"日本式"},"$preview":{"width":1440,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (this.props.updown ?? '日本式') === '米国式' ? { up: '#2fc677', down: '#ff5c5c' } : { up: '#ff5c5c', down: '#4ea2ff' };
    const col = (n) => (n > 0 ? c.up : n < 0 ? c.down : '#9aa6b6');
    const RAW = [
      ['日経225', '48,350.12', 0.86], ['TOPIX', '3,215.40', 0.57], ['NYダウ', '46,820.55', -0.21],
      ['S&P500', '6,712.30', -0.32], ['NASDAQ', '22,904.75', -0.43], ['SOX', '6,105.80', -1.12],
      ['VIX', '17.85', 5.43], ['米10年債', '4.112%', -0.75], ['USD/JPY', '154.820', 0.41],
      ['EUR/JPY', '179.36', 0.22], ['WTI', '61.48', -0.94], ['金', '4,105.6', 0.38]
    ];
    const items = RAW.map((r) => ({ name: r[0], val: r[1], chg: (r[2] > 0 ? '+' : '') + r[2].toFixed(2) + '%', color: col(r[2]) }));
    return { items };
  }
}
</script>
</body>
</html>
