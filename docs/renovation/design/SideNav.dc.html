<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","holdings","watchlist","toppicks","detail","market","news","memos","records","settings"],"default":"home"},"$preview":{"width":168,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'home';
    const keys = ['home', 'holdings', 'watchlist', 'toppicks', 'detail', 'market', 'news', 'memos', 'records', 'settings'];
    const base = 'display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 4px; text-decoration: none; ';
    const st = {};
    const cur = {};
    keys.forEach((k) => {
      st[k] = base + (k === current ? 'background: #2a2214; color: #f5b955; font-weight: 600;' : 'color: #c3ccd8;');
      cur[k] = k === current ? 'page' : 'false';
    });
    return { st, cur };
  }
}
</script>
