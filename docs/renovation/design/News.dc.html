<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ニュース — Portfolio Manager</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f14}
a{color:#7fb3ff;text-decoration:none}a:hover{color:#b3d1ff}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.panel{background:#11161d;border:1px solid #232b36;border-radius:4px;min-width:0}
.ph{display:flex;align-items:center;height:30px;padding:0 10px;border-bottom:1px solid #232b36}
.ph h2{margin:0;font-size:12px;font-weight:600}
.nr{all:unset;box-sizing:border-box;display:grid;grid-template-columns:78px 60px 96px minmax(0,1fr) 10px;align-items:center;gap:8px;width:100%;height:26px;padding:0 10px;border-bottom:1px solid #1b222c;cursor:pointer}
.nr:hover{background:#161c25}
.nr>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl{display:flex;align-items:center;gap:8px;height:24px;padding:0 10px}
.btn{height:26px;padding:0 10px;background:#1d2530;color:#c3ccd8;border:1px solid #2c3644;border-radius:4px;font:inherit;cursor:pointer}
.seg{height:24px;padding:0 9px;background:#1d2530;color:#c3ccd8;border:1px solid #2c3644;font:inherit;cursor:pointer}
.seg.on{background:#2a2214;color:#f5b955;border-color:#6b5226}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0b0f14; color: #d8dee7; font-family: Inter, 'Noto Sans JP', sans-serif; font-size: 12px; line-height: 1.4">
<dc-import name="TopBar" hint-size="100%,40px"></dc-import>
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0">
<div style="flex: 1 1 160px; max-width: 100%; display: flex">
<dc-import name="SideNav" current="news" hint-size="168px,100%"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; align-content: stretch">

<section class="panel" aria-labelledby="n-filter" style="flex: 1 1 200px; display: flex; flex-direction: column">
<div class="ph"><h2 id="n-filter">絞り込み</h2></div>
<div style="padding: 8px 10px; display: flex">
<button type="button" class="seg on" style="border-radius: 4px 0 0 4px">保有</button><button type="button" class="seg" style="margin-left: -1px">登録</button><button type="button" class="seg" style="margin-left: -1px; border-radius: 0 4px 4px 0">すべて</button>
</div>
<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="padding: 4px 10px; color: #9aa6b6; font-size: 11px">銘柄</legend>
<sc-for list="{{filters}}" as="x" hint-placeholder-count="7">
<label class="fl"><input type="checkbox" checked="{{true}}" style="accent-color: #f0a33a"><span style="color: #9aa6b6; width: 52px">{{x.code}}</span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{x.name}}</span><span class="num" style="color: #9aa6b6">{{x.n}}</span></label>
</sc-for>
</fieldset>
<fieldset style="border: 0; margin: 8px 0 0; padding: 0">
<legend style="padding: 4px 10px; color: #9aa6b6; font-size: 11px">配信元</legend>
<label class="fl"><input type="checkbox" checked="{{true}}" style="accent-color: #f0a33a">Yahoo Finance</label>
<label class="fl"><input type="checkbox" checked="{{true}}" style="accent-color: #f0a33a">Google News</label>
</fieldset>
</section>

<section class="panel" aria-labelledby="n-list" style="flex: 3 1 520px; display: flex; flex-direction: column">
<div class="ph" style="gap: 8px"><h2 id="n-list">見出し</h2><span style="color: #9aa6b6">{{count}}件・新しい順</span><span style="flex: 1"></span><span style="color: #9aa6b6">取得 21:30（15分キャッシュ）</span><button type="button" class="btn" style="height: 22px">ニュース更新</button></div>
<div style="display: grid; grid-template-columns: 78px 60px 96px minmax(0,1fr) 10px; gap: 8px; height: 22px; align-items: center; padding: 0 10px; background: #161c25; color: #9aa6b6; border-bottom: 1px solid #232b36"><span>日時</span><span>銘柄</span><span>配信元</span><span>見出し</span><span></span></div>
<div style="overflow: auto">
<sc-for list="{{news}}" as="n" hint-placeholder-count="18">
<button type="button" class="nr" style="{{n.style}}" onClick="{{n.pick}}" aria-pressed="{{n.sel}}">
<span class="num" style="color: #9aa6b6">{{n.time}}</span>
<span style="color: #7fb3ff">{{n.code}}</span>
<span style="color: #9aa6b6">{{n.src}}</span>
<span>{{n.title}}</span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: {{n.dot}}" aria-hidden="true"></span>
</button>
</sc-for>
</div>
</section>

<section class="panel" aria-labelledby="n-prev" style="flex: 2 1 340px; display: flex; flex-direction: column">
<div class="ph"><h2 id="n-prev">プレビュー</h2></div>
<article style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px; color: #9aa6b6"><span class="num">{{sel.time}}</span><span>{{sel.src}}</span><span style="color: #7fb3ff">{{sel.code}}</span></div>
<h3 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.5">[選択した記事の見出しが全文で入る]</h3>
<p style="margin: 0; color: #c3ccd8; line-height: 1.7">[配信元が提供する要約が入る。要約がない記事は見出しのみを表示する。本文はアプリ内に保存せず、元記事へのリンクで開く]</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="color: #9aa6b6">関連銘柄</span>
<a href="Detail.dc.html" style="padding: 0 6px; border: 1px solid #2c3644; border-radius: 3px">{{sel.code}}</a>
</div>
<div style="display: flex; gap: 6px; margin-top: 4px">
<a href="Detail.dc.html" style="display: flex; align-items: center; height: 28px; padding: 0 12px; border: 1px solid #2c3644; border-radius: 4px; background: #1d2530; color: #d8dee7">銘柄詳細</a>
<a href="https://finance.yahoo.com/" style="display: flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 4px; background: #f0a33a; color: #1a1205; font-weight: 600">元記事を開く ↗</a>
</div>
</article>
</section>

</main>
</div>
<dc-import name="Ticker" updown="{{updown}}" hint-size="100%,48px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"updown":{"editor":"enum","options":["日本式","米国式"],"default":"日本式","section":"表示"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const H = [['NVDA', 'NVIDIA'], ['AAPL', 'Apple'], ['MSFT', 'Microsoft'], ['7203', 'トヨタ自動車'], ['6758', 'ソニーグループ'], ['8306', '三菱UFJ FG'], ['USDJPY', '米ドル/円']];
    const counts = [5, 3, 3, 2, 2, 2, 1];
    const filters = H.map((h, i) => ({ code: h[0], name: h[1], n: counts[i] }));
    const order = ['NVDA', '7203', 'AAPL', '8306', 'MSFT', 'NVDA', '6758', 'USDJPY', 'AAPL', 'NVDA', '7203', 'MSFT', '6758', 'NVDA', '8306', 'AAPL', 'MSFT', 'NVDA'];
    const times = ['10/22 21:32', '10/22 21:05', '10/22 20:48', '10/22 19:57', '10/22 18:20', '10/22 17:41', '10/22 16:30', '10/22 15:12', '10/22 11:04', '10/22 09:45', '10/22 08:31', '10/22 07:58', '10/22 06:40', '10/21 23:47', '10/21 22:15', '10/21 21:02', '10/21 19:36', '10/21 07:12'];
    const dots = ['#2fc677', '#9aa6b6', '#9aa6b6', '#ff8a5c', '#2fc677', '#9aa6b6'];
    const sel = this.state.sel;
    const news = order.map((code, i) => ({
      code, time: times[i], src: /^\d/.test(code) ? 'Google News' : 'Yahoo Finance',
      title: '[ニュースの見出しが1行で入る。長い見出しは末尾を省略する]',
      dot: dots[i % dots.length], sel: i === sel ? 'true' : 'false',
      style: i === sel ? 'background: #1a2638' : '',
      pick: () => this.setState({ sel: i })
    }));
    const s0 = news[sel];
    return { updown: this.props.updown ?? '日本式', filters, news, count: news.length, sel: { time: s0.time, src: s0.src, code: s0.code } };
  }
}
</script>
</body>
</html>
